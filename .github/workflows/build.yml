name: Gerar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Preparar arquivos e Capacitor
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp -r index.html www/
          fi

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Block Ultra" "com.jogo.blockultra" --web-dir "www"
          npx cap add android
          npx cap sync android

          # Remove conflito de classes duplicadas do Kotlin
          echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' }" >> android/app/build.gradle

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: BlockUltra-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
